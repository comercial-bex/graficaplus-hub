name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por branch: um push novo cancela a anterior ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O repositório versiona bun.lock; usar bun mantém as versões idênticas
      # às do lockfile em vez de reresolvê-las.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Testes
        run: bunx vitest run
